<title id="title">Glyder Fach — illustrated landscape</title>
<desc id="desc">Bristly Ridge approaching the shattered summit plateau. Angular pinnacles and split rock towers on a high rocky shoulder. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
