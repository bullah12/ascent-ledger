<title id="title">Pen yr Ole Wen — illustrated landscape</title>
<desc id="desc">Southern face across the Ogwen valley. A bulky pyramidal face rising above the lake, with long Carneddau shoulders. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
