<title id="title">Suilven — illustrated landscape</title>
<desc id="desc">Broadside from the Glen Oykel approach. Two unequal summits separated by a pronounced saddle above low moorland. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
