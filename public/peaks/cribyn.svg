<title id="title">Cribyn — illustrated landscape</title>
<desc id="desc">Facing Cribyn from Pen y Fan. A sharper grassy wedge with a long receding ridge; distinct from Pen y Fan’s flat top. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
