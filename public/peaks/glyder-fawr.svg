<title id="title">Glyder Fawr — illustrated landscape</title>
<desc id="desc">Cwm Idwal headwall and the Glyder plateau. A high broken plateau above steep slabs, rather than an isolated cone. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
