<title id="title">Pen-y-ghent — illustrated landscape</title>
<desc id="desc">Across the fields from Horton-in-Ribblesdale. A blunt stepped crown, distinct limestone bands and steep southern nose. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
