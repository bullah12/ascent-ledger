<title id="title">An Teallach — illustrated landscape</title>
<desc id="desc">Along the Corrag Bhuidhe pinnacles towards the wider An Teallach ridge. Stacked sandstone towers in the foreground, with an uneven skyline receding behind. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
