<title id="title">Fairfield — illustrated landscape</title>
<desc id="desc">Along the southern horseshoe from Heron Pike. Rounded successive ridges lead to a wide, nearly level summit. Original simplified illustration informed by landscape photographs; not a measured panorama or route map.</desc>
